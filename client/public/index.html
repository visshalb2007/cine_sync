<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineSync - Watch Party</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, button, input, select, textarea {
        font-family: 'PT Serif', system-ui, -apple-system, sans-serif;
      }
      body {
        background: #111; color: #fff; min-height: 100vh;
      }
      .app { display: flex; min-height: 100vh; }

      /* ===== Sidebar ===== */
      .sidebar {
        width: 280px; flex-shrink: 0;
        background: #1a1a1a; border-right: 1px solid #2a2a2a;
        height: 100vh; max-height: 100vh;
        display: flex; flex-direction: column;
        overflow-y: auto; padding: 20px 16px 24px;
        scrollbar-width: thin; scrollbar-color: #3a3a3a transparent;
      }
      .sidebar::-webkit-scrollbar { width: 8px; }
      .sidebar::-webkit-scrollbar-track { background: transparent; }
      .sidebar::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
      .sidebar::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }

      .sidebar .section { margin-top: 24px; }
      .sidebar .section:first-child { margin-top: 0; }
      .sidebar .section-title {
        font-size: 12px; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.08em; color: #9a9a9a; margin-bottom: 12px;
      }

      /* Header "Room" with divider */
      .sidebar-header { display: flex; flex-direction: column; gap: 12px; }
      .sidebar-header .room-title {
        font-size: 18px; font-weight: 600; color: #fff;
        padding-bottom: 10px; border-bottom: 1px solid #333;
      }

      /* Room code box */
      .room-code {
        background: #1c1c1c; border: 1px solid #333; border-radius: 8px;
        padding: 12px 16px; text-align: center; position: relative;
      }
      .room-code .code-value {
        font-family: 'PT Serif', system-ui, sans-serif;
        font-size: 18px; font-weight: 700; letter-spacing: 4px; color: #4ade80;
      }
      .room-code .copy-btn {
        position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
        width: 32px; height: 32px; border-radius: 6px;
        background: transparent; border: 1px solid #333; color: #9a9a9a;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }
      .room-code .copy-btn:hover { background: #2a2a2a; border-color: #444; color: #fff; }
      .room-code .copy-btn:active { transform: translateY(-50%) scale(0.95); }
      .room-code .copy-btn.copied { background: #166534; border-color: #16a34a; color: #bbf7d0; }

      /* Status lines */
      .status-row { display: flex; flex-direction: column; gap: 6px; }
      .status-row .conn-status { font-size: 13px; color: #4ade80; }
      .status-row .watch-count { font-size: 13px; color: #9a9a9a; }

      /* Room controls */
      .control-toggle-row {
        display: flex; align-items: center; gap: 10px; cursor: pointer;
        padding: 4px 0;
      }
      .control-toggle-row input[type="checkbox"] {
        width: 18px; height: 18px; accent-color: #4ade80; flex-shrink: 0;
      }
      .control-toggle-row span { font-size: 14px; color: #e5e5e5; user-select: none; }
      .control-note { font-size: 12px; color: #9a9a9a; margin-top: 4px; min-height: 16px; }

      /* Participants */
      .participants-list { display: flex; flex-direction: column; gap: 8px; }
      .participant {
        display: flex; align-items: center; gap: 10px;
        padding: 6px 8px; border-radius: 8px;
        background: #1c1c1c; border: 1px solid #2a2a2a;
        transition: border-color 0.15s, background 0.15s;
      }
      .participant:hover { border-color: #3a3a3a; background: #222; }
      .participant .dot {
        width: 10px; height: 10px; border-radius: 50%; background: #4ade80; flex-shrink: 0;
        box-shadow: 0 0 6px rgba(74, 222, 128, 0.5);
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      .participant.offline .dot { background: #6b7280; box-shadow: none; animation: none; }
      .participant .name {
        flex: 1; min-width: 0; font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .badge {
        font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
        white-space: nowrap; margin-left: 6px;
      }
      .badge-you { background: #f59e0b; color: #111; }
      .badge-host { background: #b45309; color: #fff; }

      /* Inputs & Buttons in sidebar */
      .sidebar input[type="text"] {
        width: 100%; height: 40px; padding: 0 12px; font-size: 14px;
        background: #1c1c1c; border: 1px solid #333; border-radius: 6px;
        color: #fff; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      }
      .sidebar input[type="text"]::placeholder { color: #6b7280; opacity: 1; }
      .sidebar input[type="text"]:focus {
        outline: none; border-color: #4ade80;
        box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15); background: #111;
      }
      .sidebar input[type="text"]:disabled { opacity: 0.5; cursor: not-allowed; }

      .sidebar .input-row { display: flex; flex-direction: column; gap: 12px; }
      .sidebar .input-row > label { font-size: 12px; color: #9a9a9a; font-weight: 500; }

      .sidebar .btn {
        width: 100%; height: 40px; padding: 0 16px; font-size: 14px; font-weight: 600;
        border: none; border-radius: 6px; cursor: pointer;
        background: #4ade80; color: #111;
        transition: background 0.15s, transform 0.05s, box-shadow 0.15s, opacity 0.15s;
      }
      .sidebar .btn:hover:not(:disabled) { background: #5ee08a; }
      .sidebar .btn:active:not(:disabled) { transform: scale(0.98); }
      .sidebar .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.35); }
      .sidebar .btn:disabled { opacity: 0.45; cursor: not-allowed; background: #4ade80; }

      /* Playlist & Poll empty states */
      .sidebar .empty-state { font-size: 13px; color: #9a9a9a; text-align: center; padding: 8px 0; }

      .playlist-item, .poll-option {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 8px;
        padding: 10px 12px; font-size: 13px;
      }
      .playlist-item .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e5e5e5; }
      .playlist-item .actions { display: flex; gap: 6px; }
      .playlist-item .actions button, .poll-option button {
        padding: 6px 10px; font-size: 12px; font-weight: 500;
        border: none; border-radius: 6px; cursor: pointer;
        background: #2a2a2a; color: #e5e5e5; border: 1px solid #3a3a3a;
        transition: background 0.15s, border-color 0.15s;
      }
      .playlist-item .actions button:hover, .poll-option button:hover { background: #3a3a3a; border-color: #4a4a4a; }
      .playlist-item .actions button:focus-visible, .poll-option button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.25); }

      .poll-option { flex-direction: column; align-items: stretch; gap: 8px; }
      .poll-option .option-text { display: flex; justify-content: space-between; align-items: center; }
      .poll-option .vote-count { font-size: 12px; color: #9a9a9a; }

      .main { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px; min-width: 0; }

      /* Responsive: under 800px sidebar becomes top drawer */
      @media (max-width: 800px) {
        .app { flex-direction: column; }
        .sidebar {
          width: 100%; height: auto; max-height: 50vh; border-right: none; border-bottom: 1px solid #2a2a2a;
          position: sticky; top: 0; z-index: 10; padding: 16px;
        }
        .sidebar .section { margin-top: 16px; }
        .sidebar .section-title { margin-bottom: 8px; }
        .sidebar .input-row { gap: 8px; }
        .sidebar input[type="text"], .sidebar .btn { height: 36px; font-size: 13px; }
      }
      .video-wrap { position: relative; background: #000; border-radius: 8px; overflow: hidden; }
      video { width: 100%; max-height: 55vh; background: #000; display: block; cursor: pointer; }
      .controls {
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        background: rgba(0,0,0,0.6); padding: 10px 12px; border-radius: 8px;
      }
      .controls button, .row button, .join-box button {
        background: #fff; border: none; padding: 8px 14px;
        border-radius: 4px; cursor: pointer; font-size: 14px;
        transition: background 0.15s, transform 0.05s;
      }
      .controls button:hover, .row button:hover, .join-box button:hover { background: #ddd; }
      .controls button:active, .row button:active, .join-box button:active { transform: scale(0.98); }
      .controls button:focus-visible, .row button:focus-visible, .join-box button:focus-visible {
        outline: none; box-shadow: 0 0 0 3px rgba(29,78,216,0.4);
      }
      .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
      .controls .rate {
        background: #333; color: #fff; padding: 8px 14px;
        border-radius: 4px; cursor: pointer; font-size: 14px;
        border: 1px solid #444; min-width: 60px; text-align: center;
        transition: background 0.15s, border-color 0.15s, transform 0.05s;
      }
      .controls .rate:hover { background: #444; border-color: #555; }
      .controls .rate:active { transform: scale(0.98); }
      .controls .rate:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(74,222,128,0.4); border-color: #4ade80; }
      .status { font-size: 12px; color: #aaa; }
      .status.ok { color: #0f0; }
      .status.warn { color: #ff0; }
      .status.err { color: #f66; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .row input, .join-box input {
        padding: 8px; border-radius: 4px; border: 1px solid #444;
        background: #111; color: #fff; font-size: 14px;
      }
      .row input { flex: 1; min-width: 180px; }
      .chat { background: #222; border-radius: 8px; padding: 10px; height: 180px; overflow-y: auto; font-size: 13px; }
      .chat-message { margin-bottom: 8px; padding: 6px 10px; background: #333; border-radius: 4px; max-width: 85%; word-break: break-word; }
      .chat-message.right { margin-left: auto; background: #1d4ed8; }
      .chat-message .who { font-size: 11px; color: #aaa; display: block; }
      .playlist-item, .poll-option {
        display: flex; justify-content: space-between; align-items: center;
        background: #333; border-radius: 4px; padding: 6px 10px; margin-bottom: 6px; font-size: 13px;
      }
      .playlist-item button, .poll-option button {
        background: #444; color: #fff; border: none; border-radius: 4px;
        padding: 4px 8px; cursor: pointer; font-size: 12px;
      }
      .playlist-item button:hover, .poll-option button:hover { background: #555; }
      .reaction-float {
        position: absolute; font-size: 28px; pointer-events: none;
        animation: floatUp 3s ease-out forwards; z-index: 50;
      }
      #noVideoHint {
        position: absolute; inset: 0; display: none;
        align-items: center; justify-content: center; text-align: center;
        color: #aaa; font-size: 14px; padding: 20px; pointer-events: none;
      }
      #errBar {
        display: none; background: #7f1d1d; color: #fecaca;
        padding: 8px 12px; border-radius: 8px; font-size: 13px;
      }
      @keyframes floatUp {
        0% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-120px); }
      }
      /* Join overlay */
      #joinOverlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.85);
        display: flex; align-items: center; justify-content: center; z-index: 200;
        padding: 24px; /* ensure space on small screens */
      }
      .join-box {
        background: #222; border-radius: 12px; width: 100%; max-width: 360px;
        padding: 40px 36px; text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
      }
      .join-box h1 {
        font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
        margin-bottom: 8px; color: #fff;
      }
      .join-box > p {
        color: #aaa; font-size: 15px; line-height: 1.5;
        margin-bottom: 28px; font-weight: 400;
      }
      .join-box .form-group { margin-bottom: 16px; text-align: left; }
      .join-box label {
        display: block; font-size: 13px; color: #ccc; margin-bottom: 6px; font-weight: 400;
      }
      .join-box input {
        width: 100%; padding: 14px 16px; font-size: 15px;
        border: 1px solid #444; border-radius: 8px;
        background: #1a1a1a; color: #fff;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        text-transform: none;
      }
      .join-box input::placeholder { color: #666; opacity: 1; }
      .join-box input:focus {
        outline: none; border-color: #1d4ed8; box-shadow: 0 0 0 3px rgba(29,78,216,0.25);
        background: #111;
      }
      .join-box input#codeInput {
        text-transform: uppercase; text-align: center; letter-spacing: 3px; font-weight: 500;
      }
      .join-box .btn-row {
        display: flex; gap: 10px; margin-top: 8px;
      }
      .join-box .btn-row button {
        flex: 1; padding: 14px 20px; font-size: 15px; font-weight: 600;
        border: none; border-radius: 8px; cursor: pointer;
        background: #1d4ed8; color: #fff;
        transition: background 0.15s ease, transform 0.05s ease;
      }
      .join-box .btn-row button:hover { background: #2563eb; }
      .join-box .btn-row button:active { transform: scale(0.98); }
      .join-box .btn-row button:focus-visible {
        outline: none; box-shadow: 0 0 0 3px rgba(29,78,216,0.4);
      }
      .join-box #createBtn { background: #1d4ed8; }
      .join-box #joinBtn { background: #374151; }
      .join-box #joinBtn:hover { background: #4b5563; }
      #joinError {
        color: #f87171; font-size: 13px; min-height: 20px; margin-top: 14px;
        line-height: 1.4; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="joinOverlay">
      <div class="join-box">
        <h1>CineSync</h1>
        <p>Watch videos together, in sync.</p>
        <div class="form-group">
          <label for="nameInput">Your name</label>
          <input id="nameInput" type="text" maxlength="40" placeholder="Enter your name" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="codeInput">Room code <span style="color:#666;font-weight:400;">(optional)</span></label>
          <input id="codeInput" type="text" maxlength="8" placeholder="ABC123" autocomplete="off" />
        </div>
        <div class="btn-row">
          <button id="createBtn">Create room</button>
          <button id="joinBtn">Join room</button>
        </div>
        <div id="joinError"></div>
      </div>
    </div>

    <div class="app">
      <aside class="sidebar">
        <!-- Section: Header + Room Code -->
        <section class="section sidebar-header">
          <div class="room-title">Room</div>
          <div class="room-code" id="roomCode" title="Click to copy invite link">
            <span class="code-value">------</span>
            <button type="button" class="copy-btn" aria-label="Copy room code" title="Copy">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
          </div>
          <div class="status-row">
            <div id="connStatus" class="conn-status">connecting…</div>
            <div id="watchCount" class="watch-count"></div>
          </div>
        </section>

        <!-- Section: Room controls -->
        <section class="section">
          <div class="section-title">Room controls</div>
          <label class="control-toggle-row">
            <input type="checkbox" id="controlToggle" checked />
            <span>Everyone can control</span>
          </label>
          <div id="controlNote" class="control-note"></div>
        </section>

        <!-- Section: Participants -->
        <section class="section">
          <div class="section-title">Participants</div>
          <div id="participants" class="participants-list"></div>
        </section>

        <!-- Section: Playlist -->
        <section class="section">
          <div class="section-title">Playlist</div>
          <div id="playlist"></div>
          <div class="input-row">
            <label for="videoTitleInput">Video title</label>
            <input type="text" id="videoTitleInput" placeholder="Video title" maxlength="100" />
            <label for="videoUrlInput">Direct MP4/WebM URL</label>
            <input type="text" id="videoUrlInput" placeholder="MP4/WebM URL (not YouTube)" />
            <button type="button" id="addVideoBtn" class="btn" disabled>Add to playlist</button>
          </div>
        </section>

        <!-- Section: Poll -->
        <section class="section">
          <div class="section-title">Poll</div>
          <div id="poll"></div>
          <div class="input-row">
            <label for="pollQInput">Poll question</label>
            <input type="text" id="pollQInput" placeholder="Poll question" maxlength="200" />
            <label for="pollOptsInput">Options (comma separated)</label>
            <input type="text" id="pollOptsInput" placeholder="Options, comma separated" />
            <button type="button" id="createPollBtn" class="btn" disabled>Start poll</button>
          </div>
        </section>
      </aside>

      <main class="main">
        <div class="video-wrap" id="videoWrap">
          <video id="video" playsinline preload="metadata"></video>
          <div id="noVideoHint">No shared video loaded.<br />Pick a sample below or paste a video URL and press “Set video”.</div>
        </div>
        <div id="errBar"></div>
        <div class="controls">
          <button id="playPause">Play</button>
          <button id="seekBack">-10s</button>
          <button id="seekFwd">+10s</button>
          <button type="button" class="rate" id="rateBtn" title="Click to change playback speed">1.0x</button>
          <span class="status" id="driftLabel">drift: —</span>
          <span class="status" id="clockLabel">sync: —</span>
          <span class="status warn" id="modeLabel"></span>
        </div>
        <div class="row">
          <input id="setVideoInput" type="text" placeholder="Set shared direct MP4/WebM URL — not YouTube (host)" />
          <button id="setVideoBtn">Set video</button>
          <button class="sample-btn" data-sample="flower">Flower</button>
          <button class="sample-btn" data-sample="sintel">Sintel</button>
          <label class="status" style="cursor:pointer">Open local file
            <input id="fileInput" type="file" accept="video/*" style="display:none" />
          </label>
        </div>
        <div class="row" id="emojiRow">
          <button class="emoji-btn" data-emoji="🔥">🔥</button>
          <button class="emoji-btn" data-emoji="😂">😂</button>
          <button class="emoji-btn" data-emoji="😮">😮</button>
          <button class="emoji-btn" data-emoji="👍">👍</button>
          <button class="emoji-btn" data-emoji="❤️">❤️</button>
        </div>
        <div class="chat" id="chat"><div class="status">Chat will appear here…</div></div>
        <div class="row">
          <input id="chatInput" type="text" maxlength="500" placeholder="Type a message…" autocomplete="off" />
          <button id="chatSend">Send</button>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module">
      // ---------- DOM ----------
      const $ = (id) => document.getElementById(id);
      const video = $('video'), videoWrap = $('videoWrap');
      const playPauseBtn = $('playPause'), seekBackBtn = $('seekBack'), seekFwdBtn = $('seekFwd'), rateBtn = $('rateBtn');
      const driftLabel = $('driftLabel'), clockLabel = $('clockLabel');
      const roomCodeEl = $('roomCode'), roomCodeValue = roomCodeEl?.querySelector('.code-value'), roomCodeCopyBtn = roomCodeEl?.querySelector('.copy-btn');
      const participantsEl = $('participants'), connStatus = $('connStatus');
      const chatEl = $('chat'), chatInput = $('chatInput'), chatSend = $('chatSend');
      const emojiRow = $('emojiRow');
      const playlistEl = $('playlist'), videoTitleInput = $('videoTitleInput'), videoUrlInput = $('videoUrlInput'), addVideoBtn = $('addVideoBtn');
      const pollEl = $('poll'), pollQInput = $('pollQInput'), pollOptsInput = $('pollOptsInput'), createPollBtn = $('createPollBtn');
      const setVideoInput = $('setVideoInput');
      const overlay = $('joinOverlay'), nameInput = $('nameInput'), codeInput = $('codeInput'), joinError = $('joinError');
      const noVideoHint = $('noVideoHint'), errBar = $('errBar'), modeLabel = $('modeLabel');
      const controlToggle = $('controlToggle'), controlNote = $('controlNote'), watchCount = $('watchCount');
      let errTimer = null;

      function showError(msg) {
        errBar.textContent = msg;
        errBar.style.display = 'block';
        if (errTimer) clearTimeout(errTimer);
        errTimer = setTimeout(() => { errBar.style.display = 'none'; }, 4000);
      }

      // ---------- State ----------
      let socket = null;
      let joined = false;
      let myName = '', myRoomCode = '', myHostId = null, myEveryoneCanControl = true;
      let clientSeq = 0, baseVersion = 0, isPlaying = false;
      let clockOffset = 0, lastSyncAt = 0;
      let playbackRate = 1;
      let storedState = { positionMs: 0, serverTimestampMs: Date.now(), rate: 1, status: 'paused', videoId: '' };
      let lastDriftAbs = 0, consecutiveBeyond = 0;
      let activePoll = null;

      const SAMPLES = {
        flower: '/media/flower.mp4',
        sintel: '/media/sintel-trailer.mp4'
      };

      // YouTube/Vimeo/watch pages are not playable media files — catch early
      // with a helpful message instead of a cryptic MEDIA_ERR (code 4).
      function isUnstreamableLink(url) {
        return /(youtube\.com|youtu\.be|vimeo\.com|dailymotion\.com|netflix\.com|twitch\.tv)/i.test(url || '');
      }

      function setConn(text, cls) {
        connStatus.textContent = text;
        connStatus.className = 'status' + (cls ? ' ' + cls : '');
      }

      // ---------- Socket setup ----------
      async function getIo() {
        if (window.io) return window.io;
        const m = await import('https://cdn.socket.io/4.7.2/socket.io.esm.min.js');
        return m.io;
      }

      function serverNow() { return Date.now() + clockOffset; }

      function expectedPosition() {
        if (!storedState || storedState.status === 'paused') return storedState ? storedState.positionMs : 0;
        return storedState.positionMs + (serverNow() - storedState.serverTimestampMs) * storedState.rate;
      }

      function wireSocket(ioFn) {
        const url = location.protocol.startsWith('http') ? undefined : 'http://localhost:3000';
        socket = url ? ioFn(url) : ioFn();
        window._socket = socket; // handy for debugging

        socket.on('connect', () => {
          setConn('connected', 'ok');
          // clock sync handshake
          const t = Date.now();
          socket.emit('client-hello', { clientTime: t });
          // re-join after a drop so playback resumes
          if (joined) socket.emit('join-room', { roomCode: myRoomCode, name: myName });
        });

        socket.on('disconnect', () => setConn('reconnecting…', 'warn'));

        socket.on('sync-ack', (data) => {
          clockOffset = data.offset || 0;
          lastSyncAt = Date.now();
          clockLabel.textContent = 'sync: ' + Math.round(clockOffset) + 'ms';
        });

        socket.on('server-time', (data) => {
          clockOffset = (Date.now() - data.serverTime) / 2;
          lastSyncAt = Date.now();
          clockLabel.textContent = 'sync: ' + Math.round(clockOffset) + 'ms';
        });

        socket.on('room-snapshot', onSnapshot);
        socket.on('room-snapshot-resume', (data) => {
          baseVersion = data.version;
          applyState(data.playbackState, true);
        });

        function applyRoomMeta(data) {
          if (!data) return;
          if (data.roomCode) { myRoomCode = data.roomCode; if (roomCodeValue) roomCodeValue.textContent = myRoomCode; }
          if ('hostId' in data) myHostId = data.hostId;
          if ('everyoneCanControl' in data) {
            myEveryoneCanControl = data.everyoneCanControl !== false;
            controlToggle.checked = myEveryoneCanControl;
          }
          renderControlNote();
        }

        socket.on('participants-update', (data) => {
          applyRoomMeta(data);
          renderParticipants(data.participants || []);
        });

        socket.on('room-settings', (data) => {
          applyRoomMeta(data);
          renderParticipants(lastParticipants);
          addChat('System', data.everyoneCanControl ? 'Everyone can now control playback.' : 'Only the host can control playback now.', false);
        });

        socket.on('state-update', (data) => {
          baseVersion = data.version;
          applyState(data.playbackState, false);
        });

        socket.on('chat-message', (data) => addChat(data.name, data.text, data.userId === socket.id));
        socket.on('reaction', (data) => showReaction(data.emoji));

        socket.on('playlist-update', (data) => {
          baseVersion = data.version;
          renderPlaylist(data.playlist || []);
        });

        socket.on('poll-update', (data) => {
          if (data.type === 'create') { activePoll = data.poll; renderPoll(); }
          else if (data.type === 'vote') {
            if (activePoll && activePoll.id === data.pollId) {
              activePoll.votes[data.userId] = data.optionId;
              renderPoll();
            }
          } else if (data.type === 'close') {
            if (activePoll && activePoll.id === data.pollId) { activePoll.status = 'closed'; renderPoll(); }
          }
        });

        socket.on('host-transfer', (data) => {
          if (data && data.newHostId) myHostId = data.newHostId;
          renderControlNote();
          renderParticipants(lastParticipants);
          addChat('System', 'Host transferred.', false);
        });

        socket.on('error', (data) => {
          const msg = (data && data.message) || 'Server error';
          if (!joined) {
            joinError.textContent = msg;
          } else {
            // Our optimistic UI change was rejected: adopt the server's truth
            // (version + playback state) so controls keep working.
            if (data && typeof data.version === 'number') baseVersion = data.version;
            if (data && data.playbackState) applyState(data.playbackState, false);
            if (!/resync/i.test(msg)) showError(msg);
          }
          console.warn('server error:', msg);
        });

        // periodic clock re-sync
        setInterval(() => {
          if (socket && socket.connected) socket.emit('client-hello', { clientTime: Date.now() });
        }, 30000);
      }

      // ---------- Playback ----------
      // Local-file mode: user picked their own file. Positional sync still
      // applies, but state updates must NOT overwrite the blob: source.
      let localMode = false;

      function resolveSrc(videoId) {
        if (!videoId) return '';
        if (/^(https?:\/\/|blob:|data:)/i.test(videoId) || videoId.startsWith('/')) return videoId;
        return '/watch/' + videoId; // bare ids only
      }

      function loadVideoSource(videoId) {
        if (!videoId || localMode) return;
        const src = resolveSrc(videoId);
        let current = '';
        try { current = new URL(video.src, location.href).href; } catch (e) {}
        let target = '';
        try { target = new URL(src, location.href).href; } catch (e) { return; }
        if (current !== target) {
          try { video.src = src; } catch (e) { console.warn('video load failed', e); }
        }
      }

      function updateNoVideoHint() {
        const hasSrc = !!(video.currentSrc || video.src) && !video.src.endsWith(location.pathname);
        const show = !localMode && !storedState.videoId && !hasSrc;
        noVideoHint.style.display = show ? 'flex' : 'none';
        modeLabel.textContent = localMode ? 'local file — same file needed on all screens' : '';
      }

      video.addEventListener('error', () => {
        const err = video.error;
        if (!err || !video.src) { updateNoVideoHint(); return; }
        const hints = {
          1: 'aborted — try pressing Play again.',
          2: 'network error — the file may be unreachable. Try a sample below.',
          3: 'decoding error — this file looks corrupt. Try another source.',
          4: isUnstreamableLink(video.src)
            ? 'page links (YouTube, Vimeo…) are not playable — paste a direct MP4/WebM file URL instead.'
            : 'format not supported — use a direct MP4/WebM file URL, a sample, or a local file.'
        };
        showError('Video failed to load (code ' + err.code + '): ' + (hints[err.code] || 'unknown error.'));
        updateNoVideoHint();
      });

      function applyState(ps, hard) {
        storedState = ps;
        playbackRate = ps.rate || 1;
        video.playbackRate = playbackRate;
        if (rateBtn) rateBtn.textContent = Number(playbackRate).toFixed(2).replace(/\.?0+$/, '') + 'x';
        loadVideoSource(ps.videoId);
        updateNoVideoHint();
        const expected = ps.status === 'paused'
          ? ps.positionMs
          : ps.positionMs + (serverNow() - ps.serverTimestampMs) * playbackRate;
        // Re-seek only when meaningfully off (120ms keeps us inside the
        // 100ms dead zone's spirit and avoids seek churn on every update).
        // Never fight the player while it is seeking or still buffering.
        if (hard || video.seeking || video.readyState < 3) {
          if (hard) { try { video.currentTime = Math.max(0, expected / 1000); } catch (e) {} }
        } else if (Math.abs(video.currentTime * 1000 - expected) > 120 || !isFinite(video.currentTime)) {
          try { video.currentTime = Math.max(0, expected / 1000); } catch (e) {}
        }
        if (ps.status === 'playing' && !isPlaying) {
          isPlaying = true; playPauseBtn.textContent = 'Pause';
          video.play().catch(() => {});
        } else if (ps.status !== 'playing' && isPlaying) {
          isPlaying = false; playPauseBtn.textContent = 'Play';
          video.pause();
        }
      }

      function onSnapshot(data) {
        joined = true;
        overlay.style.display = 'none';
        myRoomCode = data.roomCode || myRoomCode;
        if (roomCodeValue) roomCodeValue.textContent = myRoomCode || '------';
        if ('hostId' in data) myHostId = data.hostId;
        if ('everyoneCanControl' in data) {
          myEveryoneCanControl = data.everyoneCanControl !== false;
          controlToggle.checked = myEveryoneCanControl;
        }
        baseVersion = data.version || 0;
        renderParticipants(data.participants || []);
        renderPlaylist(data.playlist || []);
        chatEl.innerHTML = '';
        (data.chatMessages || []).forEach((m) => addChat(m.name, m.text, false));
        applyState(data.playbackState, true);
        setConn('connected · room ' + myRoomCode, 'ok');
      }

      // Drift detection + correction every 2s
      setInterval(() => {
        if (!joined || !video.src) return;
        const expected = expectedPosition();
        const actual = (isFinite(video.currentTime) ? video.currentTime : 0) * 1000;
        const drift = actual - expected;
        const abs = Math.abs(drift);
        driftLabel.textContent = 'drift: ' + Math.round(drift) + 'ms';
        driftLabel.className = 'status' + (abs < 100 ? ' ok' : abs <= 500 ? ' warn' : ' err');

        // Don't fight the player: skip correction while paused, seeking,
        // stalled (buffering), or when the browser hasn't enough data yet.
        if (storedState.status === 'paused' || video.paused || video.seeking || video.readyState < 3) {
          if (abs < 100) { consecutiveBeyond = 0; lastDriftAbs = 0; }
          return;
        }
        if (abs > lastDriftAbs) consecutiveBeyond++; else consecutiveBeyond = 0;
        lastDriftAbs = abs;
        if (consecutiveBeyond < 2) {
          if (abs < 100) { consecutiveBeyond = 0; lastDriftAbs = 0; }
          return;
        }
        if (abs < 100) {
          // Back in the dead zone: ease the local rate back to the room rate
          // so soft-correction residue doesn't accumulate into oscillation.
          consecutiveBeyond = 0; lastDriftAbs = 0;
          const target = storedState.rate || 1;
          if (Math.abs(playbackRate - target) > 0.005) {
            playbackRate += (target - playbackRate) * 0.5;
            video.playbackRate = playbackRate;
            rateLabel.textContent = playbackRate.toFixed(1) + 'x';
          }
        }
        else if (abs > 500) {
          try { video.currentTime = Math.max(0, expected / 1000); } catch (e) {}
          consecutiveBeyond = 0; lastDriftAbs = 0;
        } else {
          const dir = drift > 0 ? 1 : -1;
          playbackRate = Math.max(0.5, Math.min(1.5, playbackRate + dir * 0.02));
          video.playbackRate = playbackRate;
          rateLabel.textContent = playbackRate.toFixed(1) + 'x';
        }
      }, 2000);

      // Buffering indicator so stalls read as "loading", not "broken"
      video.addEventListener('waiting', () => { driftLabel.textContent = 'buffering…'; driftLabel.className = 'status warn'; });
      video.addEventListener('playing', () => { consecutiveBeyond = 0; lastDriftAbs = 0; });

      // ---------- UI render ----------
      let lastParticipants = [];

      function isHost() { return !!(socket && myHostId && socket.id === myHostId); }

      function renderControlNote() {
        controlToggle.disabled = !isHost();
        controlNote.textContent = isHost()
          ? (myEveryoneCanControl ? 'You are host · everyone can control' : 'You are host · host-only control')
          : (myEveryoneCanControl ? 'Everyone can control playback' : 'Host-only control — ask the host');
      }

      function renderParticipants(list) {
        lastParticipants = list || [];
        const me = socket ? socket.id : '';
        watchCount.textContent = lastParticipants.length
          ? lastParticipants.length + (lastParticipants.length === 1 ? ' person watching' : ' people watching')
          : '';
        participantsEl.innerHTML = lastParticipants.map((p) =>
          '<div class="participant' + (p.connected === false ? ' offline' : '') + '">' +
          '<span class="dot"></span><span class="name">' + escapeHtml(p.name) + '</span>' +
          (p.id === me ? '<span class="badge badge-you">YOU</span>' : '') +
          (p.id === myHostId ? '<span class="badge badge-host">HOST</span>' : '') +
          '</div>'
        ).join('');
        renderControlNote();
      }

      function renderPlaylist(list) {
        if (!list.length) { playlistEl.innerHTML = '<div class="empty-state">Empty — add a video below.</div>'; return; }
        playlistEl.innerHTML = list.map((it) =>
          '<div class="playlist-item"><span class="title">' + escapeHtml(it.title || it.movieId) + '</span>' +
          '<span class="actions"><button data-play="' + escapeHtml(it.movieId) + '">Play</button> ' +
          '<button data-del="' + it.id + '">✕</button></span></div>'
        ).join('');
      }

      playlistEl.addEventListener('click', (e) => {
        const t = e.target;
        if (t.dataset && t.dataset.play) {
          clientSeq++;
          socket.emit('change-video', { videoId: t.dataset.play, clientSeq, baseVersion, userId: socket.id });
        } else if (t.dataset && t.dataset.del) {
          clientSeq++;
          socket.emit('remove-video', { itemId: t.dataset.del, clientSeq, baseVersion, userId: socket.id });
        }
      });

      function renderPoll() {
        if (!activePoll) { pollEl.innerHTML = '<div class="empty-state">No active poll.</div>'; return; }
        const counts = {};
        Object.values(activePoll.votes || {}).forEach((opt) => { counts[opt] = (counts[opt] || 0) + 1; });
        pollEl.innerHTML = '<div class="poll-question" style="font-size:13px;color:#e5e5e5;margin-bottom:8px;">' + escapeHtml(activePoll.question) + '</div>' +
          activePoll.options.map((o) =>
            '<div class="poll-option"><div class="option-text"><span>' + escapeHtml(o.text) + '</span>' +
            '<span class="vote-count">' + (counts[o.id] || 0) + ' vote' + ((counts[o.id] || 0) !== 1 ? 's' : '') + '</span></div>' +
            (activePoll.status === 'open'
              ? '<button data-vote="' + o.id + '" style="margin-top:4px;">Vote</button>'
              : '') + '</div>'
          ).join('') +
          (activePoll.status === 'open' ? '<button id="closePollBtn" class="btn" style="margin-top:8px;">Close poll</button>' : '<div class="empty-state" style="margin-top:8px;">Closed</div>');
      }
      renderPoll();

      pollEl.addEventListener('click', (e) => {
        const t = e.target;
        if (t.dataset && t.dataset.vote && activePoll) {
          clientSeq++;
          socket.emit('vote-poll', { pollId: activePoll.id, optionId: t.dataset.vote, clientSeq, baseVersion, userId: socket.id });
        } else if (t.id === 'closePollBtn' && activePoll) {
          clientSeq++;
          socket.emit('close-poll', { pollId: activePoll.id, clientSeq, baseVersion, userId: socket.id });
        }
      });

      // Room code copy button
      if (roomCodeCopyBtn) {
        roomCodeCopyBtn.addEventListener('click', () => {
          const code = roomCodeValue?.textContent?.trim();
          if (!code || code === '------') return;
          const base = location.protocol.startsWith('http') ? location.origin : 'http://localhost:3000';
          const url = base + '/?code=' + code;
          navigator.clipboard?.writeText(url).then(() => {
            roomCodeCopyBtn.classList.add('copied');
            roomCodeCopyBtn.setAttribute('aria-label', 'Copied!');
            setTimeout(() => {
              roomCodeCopyBtn.classList.remove('copied');
              roomCodeCopyBtn.setAttribute('aria-label', 'Copy room code');
            }, 2000);
          }).catch(() => {
            prompt('Copy invite link:', url);
          });
        });
      }

      // Input validation for sidebar buttons
      function validateAddVideoBtn() {
        if (addVideoBtn) {
          const hasTitle = videoTitleInput?.value.trim().length > 0;
          const hasUrl = videoUrlInput?.value.trim().length > 0;
          addVideoBtn.disabled = !(hasTitle || hasUrl);
        }
      }
      function validateCreatePollBtn() {
        if (createPollBtn) {
          const hasQuestion = pollQInput?.value.trim().length > 0;
          const hasOptions = pollOptsInput?.value.trim().split(',').map(s => s.trim()).filter(Boolean).length >= 2;
          createPollBtn.disabled = !(hasQuestion && hasOptions);
        }
      }
      [videoTitleInput, videoUrlInput].forEach(el => el?.addEventListener('input', validateAddVideoBtn));
      [pollQInput, pollOptsInput].forEach(el => el?.addEventListener('input', validateCreatePollBtn));

      // Room code click to copy (fallback for the whole box)
      if (roomCodeEl) {
        roomCodeEl.style.cursor = 'pointer';
        roomCodeEl.addEventListener('click', (e) => {
          if (e.target !== roomCodeCopyBtn && !roomCodeCopyBtn?.contains(e.target)) {
            roomCodeCopyBtn?.click();
          }
        });
      }

      function addChat(who, text, mine) {
        const d = document.createElement('div');
        d.className = 'chat-message' + (mine ? ' right' : '');
        const w = document.createElement('span');
        w.className = 'who'; w.textContent = who;
        d.appendChild(w);
        d.appendChild(document.createTextNode(text));
        chatEl.appendChild(d);
        chatEl.scrollTop = chatEl.scrollHeight;
      }

      function showReaction(emoji) {
        const s = document.createElement('span');
        s.className = 'reaction-float';
        s.textContent = emoji;
        s.style.left = (20 + Math.random() * 60) + '%';
        s.style.bottom = '120px';
        videoWrap.appendChild(s);
        setTimeout(() => s.remove(), 3000);
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      // ---------- Controls ----------
      // Single toggle path for the button AND clicking the video itself.
      // Desired state derives from the last server state (not the local flag),
      // so double-clicks and cross-tab races can't wedge the button.
      // The UI updates optimistically; if the server rejects the command,
      // the error handler below reverts to the true room state.
      function togglePlay() {
        if (!joined || !socket) return;
        const want = storedState.status === 'playing' ? 'paused' : 'playing';
        isPlaying = want === 'playing';
        playPauseBtn.textContent = isPlaying ? 'Pause' : 'Play';
        if (want === 'playing') video.play().catch(() => {});
        else video.pause();
        clientSeq++;
        socket.emit('play-pause', { status: want, clientSeq, baseVersion });
      }
      playPauseBtn.addEventListener('click', togglePlay);
      video.addEventListener('click', togglePlay);
      seekFwdBtn.addEventListener('click', () => {
        if (!joined || !isFinite(video.duration)) return;
        video.currentTime = Math.min(video.currentTime + 10, video.duration || video.currentTime + 10);
        clientSeq++;
        socket.emit('seek', { positionMs: Math.round(video.currentTime * 1000), clientSeq, baseVersion });
      });
      seekBackBtn.addEventListener('click', () => {
        if (!joined) return;
        video.currentTime = Math.max(video.currentTime - 10, 0);
        clientSeq++;
        socket.emit('seek', { positionMs: Math.round(video.currentTime * 1000), clientSeq, baseVersion });
      });

      // Playback speed cycling
      const SPEEDS = [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0];
      function formatSpeed(speed) {
        return Number(speed).toFixed(2).replace(/\.?0+$/, '') + 'x';
      }
      function cyclePlaybackRate() {
        if (!joined || !socket) return;
        const current = playbackRate || 1.0;
        const idx = SPEEDS.findIndex(s => Math.abs(s - current) < 0.01);
        const nextIdx = (idx + 1) % SPEEDS.length;
        const nextRate = SPEEDS[nextIdx];

        // Optimistic UI update
        playbackRate = nextRate;
        video.playbackRate = nextRate;
        if (rateBtn) rateBtn.textContent = formatSpeed(nextRate);

        // Send to server
        clientSeq++;
        socket.emit('set-rate', { rate: nextRate, clientSeq, baseVersion });
      }
      if (rateBtn) rateBtn.addEventListener('click', cyclePlaybackRate);

      function sendChat() {
        const v = chatInput.value.trim();
        if (!v || !joined) return;
        clientSeq++;
        socket.emit('chat-message', { text: v, clientSeq, baseVersion, userId: socket ? socket.id : '' });
        chatInput.value = '';
      }
      chatSend.addEventListener('click', sendChat);
      chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChat(); });

      emojiRow.addEventListener('click', (e) => {
        const t = e.target.closest ? e.target.closest('.emoji-btn') : null;
        if (!t || !joined) return;
        clientSeq++;
        socket.emit('reaction', { emoji: t.dataset.emoji, clientSeq, baseVersion, userId: socket.id });
        showReaction(t.dataset.emoji);
      });

      $('addVideoBtn').addEventListener('click', () => {
        if (!joined) return;
        const title = videoTitleInput.value.trim() || videoUrlInput.value.trim();
        const movieId = videoUrlInput.value.trim();
        if (!movieId) return;
        if (isUnstreamableLink(movieId)) {
          showError('That looks like a watch-page link (YouTube etc.) — those cannot stream. Paste a direct MP4/WebM URL.');
          return;
        }
        clientSeq++;
        socket.emit('add-video', { movieId, title, clientSeq, baseVersion, userId: socket.id });
        videoTitleInput.value = ''; videoUrlInput.value = '';
      });

      $('createPollBtn').addEventListener('click', () => {
        if (!joined) return;
        const q = pollQInput.value.trim();
        const opts = pollOptsInput.value.split(',').map((s) => s.trim()).filter(Boolean);
        if (!q || opts.length < 2) return;
        socket.emit('create-poll', { question: q, options: opts });
        pollQInput.value = ''; pollOptsInput.value = '';
      });

      $('setVideoBtn').addEventListener('click', () => {
        if (!joined) return;
        const v = setVideoInput.value.trim();
        if (!v) return;
        if (isUnstreamableLink(v)) {
          showError('That looks like a watch-page link (YouTube etc.) — those cannot stream. Paste a direct MP4/WebM URL.');
          return;
        }
        localMode = false;
        updateNoVideoHint();
        clientSeq++;
        socket.emit('change-video', { videoId: v, clientSeq, baseVersion, userId: socket.id });
      });

      document.querySelectorAll('.sample-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const url = SAMPLES[btn.dataset.sample];
          if (!url) return;
          if (!joined) { // not in a room yet: preview locally
            video.src = url;
            video.play().catch(() => {});
            updateNoVideoHint();
            return;
          }
          // Share with the whole room (host-only on the server)
          localMode = false;
          updateNoVideoHint();
          clientSeq++;
          socket.emit('change-video', { videoId: url, clientSeq, baseVersion, userId: socket.id });
        });
      });

      $('fileInput').addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        localMode = true; // keep shared state from overwriting our file
        try { video.src = URL.createObjectURL(f); } catch (err) { showError('Could not open that file.'); return; }
        video.play().catch(() => {});
        updateNoVideoHint();
        addChat('System', 'Local file mode: "' + f.name + '". Everyone must open the same file; play/pause/seek stay in sync.', false);
      });

      controlToggle.addEventListener('change', () => {
        if (!joined || !socket) return;
        // Only the host's toggle is enabled; server enforces this too.
        socket.emit('toggle-control', { open: controlToggle.checked, userId: socket.id });
      });

      // ---------- Join ----------
      function doJoin(code) {
        joinError.textContent = '';
        myName = (nameInput.value.trim() || 'Anonymous').slice(0, 40);
        myRoomCode = (code || '').trim().toUpperCase();
        socket.emit('join-room', { roomCode: myRoomCode, name: myName });
      }
      $('createBtn').addEventListener('click', () => doJoin(''));
      $('joinBtn').addEventListener('click', () => {
        if (!codeInput.value.trim()) { joinError.textContent = 'Enter a room code, or Create room.'; return; }
        doJoin(codeInput.value);
      });
      // prefill code from ?code= links
      try {
        const q = new URLSearchParams(location.search).get('code');
        if (q) codeInput.value = q.toUpperCase();
      } catch (e) {}

      // ---------- Boot ----------
      (async function boot() {
        try {
          const ioFn = await getIo();
          wireSocket(ioFn);
        } catch (err) {
          setConn('failed to load socket.io', 'err');
          joinError.textContent = 'Could not connect. Is the server running on :3000?';
          console.error(err);
        }
      })();
    </script>
  </body>
</html>
